name: CD Pipeline

on:
  push:
    branches: [main]
    tags:
      - 'v*'

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME_SERVER: ${{ github.repository }}-server
  IMAGE_NAME_CLIENT: ${{ github.repository }}-client

jobs:
  # Build and push Docker images
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      server-image: ${{ steps.meta-server.outputs.tags }}
      client-image: ${{ steps.meta-client.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for server
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_SERVER }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for client
        id: meta-client
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_CLIENT }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build and push client image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: staging
      url: https://staging.example.com
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add your deployment script here
          # Example: kubectl, helm, docker-compose, etc.
          
      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."
          # Add smoke test commands here
          # Example: curl health endpoints, basic API tests

      - name: Notify deployment
        if: always()
        run: |
          echo "Staging deployment completed"
          # Add notification logic (Slack, email, etc.)

  # Deploy to production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-staging]
    environment:
      name: production
      url: https://example.com
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production (Blue)
        id: deploy-blue
        run: |
          echo "Deploying to production blue environment..."
          # Add your blue-green deployment script here
          # Deploy to blue environment while green is live

      - name: Run health checks
        run: |
          echo "Running health checks on blue environment..."
          # Add health check commands
          # Verify blue environment is healthy

      - name: Switch traffic to blue
        run: |
          echo "Switching traffic to blue environment..."
          # Update load balancer to point to blue
          # Monitor for errors

      - name: Monitor metrics
        run: |
          echo "Monitoring metrics for 15 minutes..."
          # Monitor error rates, latency, etc.
          # Sleep for monitoring period
          sleep 900

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Rolling back to green environment..."
          # Switch traffic back to green
          # Alert team of rollback

      - name: Decommission green
        if: success()
        run: |
          echo "Decommissioning green environment..."
          # Scale down or remove old green environment

      - name: Notify deployment
        if: always()
        run: |
          echo "Production deployment completed"
          # Add notification logic (Slack, email, PagerDuty, etc.)

  # Rollback workflow
  rollback:
    name: Rollback Production
    runs-on: ubuntu-latest
    environment:
      name: production
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Rollback to previous version
        run: |
          echo "Rolling back to previous version..."
          # Add rollback logic
          # Redeploy previous stable version

      - name: Verify rollback
        run: |
          echo "Verifying rollback..."
          # Run health checks
          # Verify system is stable

      - name: Notify rollback
        if: always()
        run: |
          echo "Rollback completed"
          # Add notification logic
